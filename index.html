<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FF8 Selphie Slot calculator." />
    <title>FF8 Selphie Slot Calculator</title>
    <script>
      // Resolve the saved colour scheme before first paint. Shared key, so the
      // choice carries over from the hub. See @ff8-speedruns/ui.
      try {
        var s = window.localStorage.getItem('ff8-color-scheme');
        var scheme = s === 'light' || s === 'dark' || s === 'auto' ? s : 'auto';
        document.documentElement.setAttribute(
          'data-mantine-color-scheme',
          scheme !== 'auto'
            ? scheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light',
        );
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
